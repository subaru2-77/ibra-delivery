    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Font Awesome Icons -->

    <style>
        :root {
            --primary-blue: #0088ff;
            --primary-neon: #00d2ff;
            --dark-bg: #070d18;
            --dark-card: #0d1726;
            --dark-card-hover: #132238;
            --white: #ffffff;
            --gray-text: #94a3b8;
            --accent-green: #25d366;
            --price-badge: #00f0ff;
            --border-glow: rgba(0, 136, 255, 0.25);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--dark-bg);
            color: #f1f5f9;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 999;
            background: rgba(7, 13, 24, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 136, 255, 0.2);
            padding: 12px 0;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-neon);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .brand-logo i {
            font-size: 1.8rem;
            color: var(--primary-neon);
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--white);
            letter-spacing: 0.5px;
        }

        .brand-title span {
            color: var(--primary-blue);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .btn-whatsapp {
            background-color: var(--accent-green);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: var(--white);
        }

        .btn-instagram:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.4);
        }

        .btn-phone {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .btn-phone:hover {
            background-color: #0070d6;
            transform: translateY(-2px);
        }

        /* Hero */
        .hero {
            padding: 60px 0 50px;
            position: relative;
            background: radial-gradient(circle at 50% 20%, rgba(0, 136, 255, 0.15) 0%, transparent 65%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 40px;
            align-items: center;
        }

        .city-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 136, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: var(--primary-neon);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: 2.7rem;
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 15px;
            color: var(--white);
        }

        .hero-title span {
            background: linear-gradient(90deg, #00d2ff, #0088ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 1.15rem;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .pricing-banner {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px dashed rgba(0, 210, 255, 0.5);
            padding: 12px 20px;
            border-radius: 14px;
            margin-bottom: 30px;
        }

        .pricing-banner .price {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--price-badge);
        }

        /* Order Form Box */
        .order-box {
            background: var(--dark-card);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .order-box h3 {
            font-size: 1.35rem;
            color: var(--white);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .order-box p {
            color: var(--gray-text);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #e2e8f0;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: #09101c;
            border: 1px solid #1e293b;
            color: var(--white);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.25);
        }

        /* Features strip */
        .features-strip {
            background: #0b1322;
            padding: 25px 0;
            border-top: 1px solid rgba(0, 136, 255, 0.15);
            border-bottom: 1px solid rgba(0, 136, 255, 0.15);
        }
